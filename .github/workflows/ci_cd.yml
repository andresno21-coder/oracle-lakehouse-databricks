# CI/CD del lakehouse
#  - En cada pull request y push: pruebas unitarias de las transformaciones (Spark local) y validación del bundle.
#  - Push a main: despliegue automático a DEV.
#  - Ejecución manual (workflow_dispatch) con entorno "prod": despliegue a PRODUCCIÓN (requiere aprobación del environment).
#  - Sin los secretos DATABRICKS_HOST y DATABRICKS_TOKEN solo corren las pruebas; validar y desplegar quedan omitidos.
name: ci-cd

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno destino
        type: choice
        options: [ dev, prod ]
        default: dev

jobs:
  pruebas:
    runs-on: ubuntu-latest
    outputs:
      databricks: ${{ steps.credenciales.outputs.disponibles }}
    steps:
      # Validar y desplegar solo corren si el repositorio tiene configurados los secretos del workspace
      - id: credenciales
        run: echo "disponibles=${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests

  validar_bundle:
    runs-on: ubuntu-latest
    needs: pruebas
    if: needs.pruebas.outputs.databricks == 'true'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev

  desplegar:
    runs-on: ubuntu-latest
    needs: validar_bundle
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.entorno || 'dev' }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t ${{ github.event.inputs.entorno || 'dev' }}
