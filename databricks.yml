# Databricks Asset Bundle: despliega la carpeta proceso/ (notebooks + paquete oracle_lakehouse) y el workflow.
# Por entorno solo cambia el catálogo; esquemas y tablas se llaman igual en dev y en prod.
bundle:
  name: oracle-lakehouse

include:
  - resources/*.yml

# Al workspace solo sube lo que el workflow ejecuta. Datasets, evidencias, tablero y documentación viven en GitHub.
sync:
  include:
    - proceso/**
  exclude:
    - datasets/**
    - evidencias/**
    - certificaciones/**
    - dashboard/**
    - databricks-app/**
    - docs/**
    - tests/**
    - herramientas/**
    - "**/__pycache__/**"

variables:
  catalogo:
    description: Catálogo de Unity Catalog del entorno
    default: oracle_dev
  cuenta_adls:
    description: Cuenta ADLS Gen2 del lakehouse
    default: storacleinvestment
  ruta_raw:
    description: Contenedor raw en ADLS Gen2 (insumos); se accede con Managed Identity
    default: abfss://raw@storacleinvestment.dfs.core.windows.net
  correo_alertas:
    description: Correo que recibe las fallas del workflow
    default: alertas@oracleinvestment.example
  nodo:
    description: Tipo de máquina del clúster del workflow
    default: Standard_D4ds_v7   # 4 vCPU; en la suscripción de prueba (East US 2) solo la generación v7 está habilitada

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405617329608975.15.azuredatabricks.net   # workspace dbw-oracle-lakehouse (East US 2, Premium)
    variables:
      catalogo: oracle_dev

  prod:
    mode: production
    workspace:
      host: https://adb-7405617329608975.15.azuredatabricks.net   # mismo workspace; prod se aísla por catálogo (oracle_prd) y ruta
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalogo: oracle_prd
    # Con un service principal, el workflow de producción deja de depender de un usuario:
    # run_as:
    #   service_principal_name: <application-id del service principal sp-oracle-etl>
